# ==============================================================================
# Production Profile Configuration (Group F06 - IP: 194.242.57.93)
# ==============================================================================

# Server Port
server.port=8086

# ==============================================================================
# PostgreSQL Database Configuration
# ==============================================================================
spring.datasource.url=jdbc:postgresql://194.242.57.93:5006/fooddelivery06
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================================
# Actuator & Prometheus Metrics Configuration (Grafana / Prometheus)
# ==============================================================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ==============================================================================
# Loki Logging Configuration
# ==============================================================================
loki.url=http://194.242.57.93:3100/loki/api/v1/push
logging.level.root=INFO
logging.level.com.ait=DEBUG
logging.level.org.springframework.web=INFO

# ==============================================================================
# Mailer / Portmailer Configuration
# ==============================================================================
spring.mail.host=194.242.57.93
spring.mail.port=1025
spring.mail.username=mailer
spring.mail.password=mailer
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.default-encoding=UTF-8
