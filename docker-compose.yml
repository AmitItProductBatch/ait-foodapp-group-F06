name: ait-foodapp-group-f06

services:
  # ============================================================================
  # PostgreSQL Database Service
  # ============================================================================
  postgres-db:
    image: postgres:16-alpine
    container_name: fooddelivery-postgres-06
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fooddelivery06}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5006}:5432"
    volumes:
      - postgres_data06:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fooddelivery06}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fooddelivery-network06

  # ============================================================================
  # Spring Boot Backend API Service
  # ============================================================================
  backend:
    build:
      context: ./food-delivery-backend/food-delivery-backend
      dockerfile: Dockerfile
    container_name: fooddelivery-backend-06
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8086}:8086"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-fooddelivery06}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8086
      LOKI_URL: http://194.242.57.93:3100/loki/api/v1/push
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - fooddelivery-network06

  # ============================================================================
  # React / Vite Frontend Service
  # ============================================================================
  frontend:
    build:
      context: ./food-delivery-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://194.242.57.93:8086/api/users}
    container_name: fooddelivery-frontend-06
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4006}:80"
    depends_on:
      - backend
    networks:
      - fooddelivery-network06

# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  postgres_data06:
    name: fooddelivery_postgres_data06

# ==============================================================================
# Networks
# ==============================================================================
networks:
  fooddelivery-network06:
    name: fooddelivery-network06
    driver: bridge
